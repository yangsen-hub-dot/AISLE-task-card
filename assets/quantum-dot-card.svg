<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" role="img" aria-labelledby="title desc">
 <title id="title">Quantum dot formulation optimisation</title>
 <desc id="desc">Schematic 96-well plate, 48 candidate formulations and a target emission wavelength of 600 nanometres. No experimental result is shown.</desc>
 <defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5eff9"/><stop offset="1" stop-color="#e9deef"/></linearGradient>
  <linearGradient id="plate" x2=".8" y2="1"><stop stop-color="#fffdfd"/><stop offset="1" stop-color="#efe7f4"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#d7b2c4" stop-opacity=".4"/><stop offset="1" stop-color="#d7b2c4" stop-opacity="0"/></radialGradient>
  <pattern id="wells" width="23" height="23" patternUnits="userSpaceOnUse"><circle cx="11.5" cy="11.5" r="6.8" fill="#e1d2ea" stroke="#c4b0d2" stroke-width="1"/><circle cx="10" cy="9.5" r="2" fill="#f9f5fc"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#6a4b82" flood-opacity=".13"/></filter>
 </defs>
 <rect width="760" height="475" fill="url(#bg)"/>
 <ellipse cx="615" cy="257" rx="224" ry="236" fill="url(#glow)"/>
 <g font-family="Arial, sans-serif">
  <text x="40" y="53" font-size="12" letter-spacing="2.3" fill="#75569a">EXPERIMENTAL OPTIMISATION</text>
  <g transform="translate(49 142) rotate(-5 150 100)" filter="url(#shadow)">
   <rect x="-13" y="-22" width="315" height="232" rx="20" fill="url(#plate)" stroke="#cdbcda"/>
   <rect width="276" height="184" rx="4" fill="url(#wells)"/>
   <path d="M282 1h7v42h-7" fill="none" stroke="#89689f" stroke-width="1.3"/>
  </g>
  <text x="421" y="151" font-size="13" letter-spacing="1.4" fill="#86688e">TARGET EMISSION</text>
  <text x="414" y="260" font-size="112" font-family="Georgia, serif" letter-spacing="-5" fill="#75569a">600</text>
  <text x="624" y="259" font-size="23" fill="#75569a">nm</text>
  <path d="M421 281H687" stroke="#c9b5d5"/>
  <text x="421" y="309" font-size="15" fill="#685273">48 candidate formulations</text>
  <text x="421" y="335" font-size="13" fill="#88738f">2 measured wells per formulation</text>
  <text x="52" y="402" font-size="12" fill="#88738f">pH · MPA · Na₂S</text>
  <text x="688" y="402" text-anchor="end" font-size="11" letter-spacing="1.6" fill="#88738f">TASK SPECIFICATION</text>
 </g>
</svg>
